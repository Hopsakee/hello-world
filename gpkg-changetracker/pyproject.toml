[project]
name = "gpkg-changetracker"
version = "0.1.0"
description = "Marimo app to edit GeoPackage attributes with automatic change-date tracking and changed-rows-only export"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "marimo>=0.14",
    "pandas>=2.0",
    "altair>=5.0",
    "pyproj>=3.6",
    "pyarrow>=15",
]

[project.scripts]
gpkg-changetracker = "gpkg_changetracker.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpkg_changetracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = ["pytest>=8.0"]
